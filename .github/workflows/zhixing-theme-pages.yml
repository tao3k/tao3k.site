name: Deploy Zhixing theme provider

on:
  push:
    branches: [main]
    paths:
      - "theme/**"
      - "content/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/zhixing-theme-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run theme:build
        env:
          ORG_ZHIXING_THEME_PUBLIC_URL: https://tao3k.github.io/tao3k.site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: theme/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
