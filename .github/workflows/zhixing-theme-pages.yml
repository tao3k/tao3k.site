name: Deploy tao3k.site

on:
  push:
    branches: [main]
    paths:
      - "theme/**"
      - "docs/**"
      - "org-zhixing.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/zhixing-theme-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tao3k.site
        uses: actions/checkout@v6

      - name: Checkout Org Zhixing host
        uses: actions/checkout@v6
        with:
          repository: tao3k/org-zhixing-themes
          ref: 5ca54c9fd501c8fbac14932dc11df52fd00e6943
          path: .org-zhixing-host

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .org-zhixing-host/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install Org Zhixing host dependencies
        run: npm ci --prefix .org-zhixing-host

      - name: Build federated tao3k theme
        run: npm run theme:build
        env:
          ORG_ZHIXING_THEME_PUBLIC_URL: https://tao3k.github.io/tao3k.site/theme/

      - name: Build Org Zhixing application
        working-directory: .org-zhixing-host
        run: >-
          npm run pages:build --
          --config "$GITHUB_WORKSPACE/org-zhixing.toml"
          --content "$GITHUB_WORKSPACE/docs"
          --out "$GITHUB_WORKSPACE/.pages"
          --base /tao3k.site
        env:
          ORG_ZHIXING_THEME_ENTRY: https://tao3k.github.io/tao3k.site/theme/mf-manifest.json

      - name: Assemble host and federated theme
        run: |
          npm run pages:routes -- .pages
          mkdir -p .pages/theme
          cp -R theme/dist/. .pages/theme/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
